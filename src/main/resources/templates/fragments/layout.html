<!DOCTYPE html>
<!--
  =====================================================================
   FRAGMENTOS COMPARTIDOS - GESTIÓN DE SUBSIDIOS Y EMPLEADOS
  =====================================================================
   Este archivo contiene los fragmentos reutilizables de la aplicación:
   - head: configuración general, estilos y título de cada página.
   - navbar: menú de navegación.
   - footer: pie de página.
   - scripts: librerías JavaScript y funciones comunes.

   Uso desde otras páginas:

   <head th:replace="~{fragments/layout :: head('Empleados')}"></head>

   <nav th:replace="~{fragments/layout :: navbar('empleados')}"></nav>

   <footer th:replace="~{fragments/layout :: footer}"></footer>

   <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================= -->
<!-- 1. HEAD: ESTILOS Y CONFIGURACIÓN GENERAL                      -->
<!-- ============================================================= -->
<head th:fragment="head(titulo)">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo} + ' · Gestión de Subsidios'">
        Gestión de Subsidios
    </title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- DataTables para tablas interactivas -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css">

    <!-- Hoja de estilos propia -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<!-- ============================================================= -->
<!-- 2. MENÚ DE NAVEGACIÓN                                         -->
<!-- ============================================================= -->
<!--
    El parámetro activo permite identificar la página actual
    y resaltar su opción correspondiente en el menú.

    Valores:
    - inicio
    - empleados
    - subsidios
-->
<nav th:fragment="navbar(activo)"
     class="navbar navbar-expand-lg navbar-dark barra">

    <div class="container">

        <!-- Nombre de la aplicación -->
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-clipboard2-pulse"></i>
            Gestión de Subsidios
        </a>

        <!-- Botón para dispositivos móviles -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
                aria-controls="menu"
                aria-expanded="false"
                aria-label="Mostrar navegación">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Opciones del menú -->
        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <!-- Inicio -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:classappend="${activo == 'inicio'} ? 'active'"
                       th:href="@{/}">

                        <i class="bi bi-house"></i>
                        Inicio

                    </a>

                </li>

                <!-- Empleados -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:classappend="${activo == 'empleados'} ? 'active'"
                       th:href="@{/empleados}">

                        <i class="bi bi-people"></i>
                        Empleados

                    </a>

                </li>

                <!-- Subsidios -->
                <li class="nav-item">

                    <a class="nav-link"
                       th:classappend="${activo == 'subsidios'} ? 'active'"
                       th:href="@{/subsidios}">

                        <i class="bi bi-file-earmark-medical"></i>
                        Subsidios

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- ============================================================= -->
<!-- 3. PIE DE PÁGINA                                              -->
<!-- ============================================================= -->
<footer th:fragment="footer" class="pie text-center">

    <div class="container">

        <span>
            Sistema de Gestión de Subsidios y Empleados
        </span>

        <div class="small mt-1">
            Desarrollado con Java Spring Boot · Thymeleaf
        </div>

    </div>

</footer>

<!-- ============================================================= -->
<!-- 4. LIBRERÍAS JAVASCRIPT                                       -->
<!-- ============================================================= -->
<th:block th:fragment="scripts">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables -->
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>

    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>

    <!-- Notify.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/notify/0.4.2/notify.min.js"></script>

    <!-- Funciones JavaScript comunes -->
    <script th:src="@{/js/app.js}"></script>

    <!-- Mensajes enviados desde el controlador mediante RedirectAttributes -->
    <script th:inline="javascript">

        const mensajeOk = /*[[${ok}]]*/ null;
        const mensajeError = /*[[${error}]]*/ null;

        if (mensajeOk) {
            notificar(mensajeOk, 'success');
        }

        if (mensajeError) {
            notificar(mensajeError, 'error');
        }

    </script>

</th:block>

</body>
</html>
